<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ZİRVE — Antrenman Tırmanışı</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --valley:#0B1220;
    --panel:#131F38;
    --rock:#243352;
    --rock2:#324365;
    --snow:#DCE9F5;
    --ink:#EAF1FA;
    --muted:#8296B4;
    --gold:#FFB627;      /* efor / zirve */
    --gold-2:#FF8A3D;
    --cyan:#38BDF8;      /* dinlenme */
    --go:#34D399;        /* tamamla */
    --line:rgba(255,255,255,.08);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:'Inter',system-ui,sans-serif;
    color:var(--ink);
    background:var(--valley);
    overflow:hidden;
    user-select:none;
  }
  #app{
    position:relative;
    height:100dvh; width:100%;
    max-width:520px; margin:0 auto;
    display:flex; flex-direction:column;
    background:linear-gradient(180deg,var(--sky-top,#0B1220) 0%, var(--sky-bot,#182238) 100%);
    transition:background 1.2s ease;
  }

  /* ---------- MOUNTAIN HEADER ---------- */
  .peak{
    position:relative; height:22vh; min-height:150px; max-height:200px; flex:none;
    overflow:hidden;
  }
  .topbar{
    position:absolute; inset:0 0 auto 0; z-index:5;
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 18px;
  }
  .brand{
    font-family:'Anton',sans-serif; letter-spacing:.14em;
    font-size:20px; color:var(--snow);
  }
  .brand small{display:block;font-family:'Archivo';font-weight:600;font-size:9px;letter-spacing:.34em;color:var(--muted)}
  .prog-pill{
    font-family:'Archivo'; font-weight:700; font-size:12px; letter-spacing:.05em;
    color:var(--valley); background:var(--gold);
    padding:5px 11px; border-radius:20px;
  }
  svg.ridge{position:absolute;inset:0;width:100%;height:100%}
  .climber{transition:transform .9s cubic-bezier(.34,1.3,.5,1)}
  .flagPulse{animation:flagP 2.4s ease-in-out infinite}
  @keyframes flagP{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}

  /* ---------- STAGE / ACTION AREA ---------- */
  .stageBox{flex:1;position:relative;overflow:hidden}
  .card{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:18px 24px 12px; text-align:center;
  }
  .card.enter{animation:slideIn .55s cubic-bezier(.2,.7,.2,1) both}
  .card.leave{animation:slideOut .4s ease both}
  @keyframes slideIn{from{opacity:0;transform:translateX(80%)}to{opacity:1;transform:translateX(0)}}
  @keyframes slideOut{from{opacity:1;transform:translateX(0)}to{opacity:0;transform:translateX(-45%)}}

  .eyebrow{
    font-family:'Archivo'; font-weight:700; font-size:11px; letter-spacing:.28em;
    text-transform:uppercase; color:var(--gold);
    display:flex; align-items:center; gap:8px;
  }
  .eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--gold)}
  .place{font-size:12px;color:var(--muted);margin-top:2px;letter-spacing:.04em}

  .hero-num{
    font-family:'Anton',sans-serif; line-height:.9;
    font-size:clamp(90px,34vw,150px); color:var(--snow);
    margin:6px 0 -4px; text-shadow:0 6px 30px rgba(0,0,0,.4);
  }
  .move-name{
    font-family:'Archivo'; font-weight:800; font-size:26px; letter-spacing:-.01em;
    margin-top:4px;
  }
  .move-sub{font-size:14px;color:var(--muted);margin-top:8px;max-width:280px;line-height:1.45}
  .unit-chip{
    display:inline-block; margin-top:14px;
    font-family:'Archivo';font-weight:700;font-size:12px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--gold); border:1px solid rgba(255,182,39,.35); background:rgba(255,182,39,.08);
    padding:6px 14px;border-radius:20px;
  }

  /* rest ring */
  .ring-wrap{position:relative;width:210px;height:210px;margin:4px 0}
  .ring-wrap svg{transform:rotate(-90deg)}
  .ring-time{
    position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  }
  .ring-time b{font-family:'Anton';font-size:58px;color:var(--cyan);line-height:1}
  .ring-time span{font-size:12px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase;margin-top:4px}
  .rest-mini{display:flex;gap:10px;margin-top:6px}
  .rest-mini button{
    font-family:'Archivo';font-weight:600;font-size:13px;color:var(--ink);
    background:rgba(255,255,255,.06);border:1px solid var(--line);
    padding:8px 16px;border-radius:12px;
  }

  /* finish */
  .summit .hero-num{color:var(--gold)}
  .summit .eyebrow,.summit .eyebrow .dot{color:var(--gold)}

  /* ---------- FOOTER BUTTON ---------- */
  .cta{
    width:100%; border:none; border-radius:18px;
    font-family:'Archivo'; font-weight:800; font-size:18px; letter-spacing:.02em;
    color:var(--valley); padding:20px; cursor:pointer;
    background:linear-gradient(100deg,var(--gold),var(--gold-2));
    box-shadow:0 10px 28px -8px rgba(255,138,61,.6);
    transition:transform .08s ease, filter .2s;
  }
  .cta:active{transform:scale(.97)}
  .cta.go{
    background:#ff5f05;
    box-shadow:0 8px 24px -6px rgba(255,95,5,.45);
    color:#ffffff;
    border-radius:14px;
    font-size:17px;
    letter-spacing:.1em;
    padding:0;
    height:64px;
  }
  .cta.ghost{background:transparent;color:var(--muted);box-shadow:none;font-size:14px;font-weight:600;padding:12px}
  .cta.rest{background:linear-gradient(100deg,var(--cyan),#2E8FD8);box-shadow:0 10px 28px -8px rgba(56,189,248,.5);color:#08131f}

  .round-track{display:flex;gap:6px;justify-content:center;margin-top:14px}
  .round-track i{width:22px;height:4px;border-radius:3px;background:rgba(255,255,255,.14)}
  .round-track i.on{background:var(--gold)}
  .round-track i.done{background:var(--go)}

  /* süper set etiketi */
  .ss-badge{
    display:inline-flex;align-items:center;gap:7px;
    font-family:'Archivo';font-weight:700;font-size:11px;letter-spacing:.18em;text-transform:uppercase;
    color:var(--gold-2);border:1px solid rgba(255,138,61,.3);background:rgba(255,138,61,.08);
    padding:5px 12px;border-radius:20px;margin-top:4px;
  }
  .ss-badge .arrow{opacity:.7}

  /* ---------- ANİMASYONLU KARAKTER ---------- */
  .scene{width:100%;display:flex;justify-content:center;align-items:flex-end;margin:2px 0}
  .hero-char{width:min(66%,230px);height:auto;max-height:clamp(150px,29vh,230px);overflow:visible}
  .hero-char .torso{fill:#2C3E63}
  .hero-char .head{fill:#EAD9C4}
  .hero-char .beanie{fill:var(--gold)}
  .hero-char .limb{stroke:#2C3E63;stroke-width:13;stroke-linecap:round;stroke-linejoin:round;fill:none}
  .hero-char .glove{fill:var(--gold)}
  .hero-char .kb{opacity:0;transition:opacity .3s}
  .hero-char .kb circle{fill:#16233E}
  .hero-char .kb rect{fill:none;stroke:var(--gold);stroke-width:4}
  .hero-char .bar{opacity:0;transition:opacity .3s}
  .hero-char .bar rect{fill:#4A5E86}
  /* eklem pivotları (viewBox koordinatlarında) */
  .hero-char .char{transform-origin:100px 130px}
  .hero-char .armR{transform-origin:116px 72px}
  .hero-char .armL{transform-origin:84px 72px}
  .hero-char .foreR{transform-origin:116px 100px}
  .hero-char .foreL{transform-origin:84px 100px}
  .hero-char .legR{transform-origin:110px 146px}
  .hero-char .legL{transform-origin:90px 146px}

  /* dinlenme / kademe: nefes */
  .m-rest .char,.m-done .char{animation:breathe 3.2s ease-in-out infinite}
  @keyframes breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}

  /* ISINMA: jumping jack */
  .m-warmup .char{animation:hop .85s ease-in-out infinite}
  @keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-13px)}}
  .m-warmup .armR{animation:jjR .85s ease-in-out infinite}
  .m-warmup .armL{animation:jjL .85s ease-in-out infinite}
  @keyframes jjR{0%,100%{transform:rotate(0)}50%{transform:rotate(-150deg)}}
  @keyframes jjL{0%,100%{transform:rotate(0)}50%{transform:rotate(150deg)}}
  .m-warmup .legR{animation:jjLR .85s ease-in-out infinite}
  .m-warmup .legL{animation:jjLL .85s ease-in-out infinite}
  @keyframes jjLR{0%,100%{transform:rotate(0)}50%{transform:rotate(-20deg)}}
  @keyframes jjLL{0%,100%{transform:rotate(0)}50%{transform:rotate(20deg)}}

  /* BARFİKS: bardan çekiş */
  .m-barfiks .bar{opacity:1}
  .m-barfiks .armR{transform:rotate(178deg)}
  .m-barfiks .armL{transform:rotate(-178deg)}
  .m-barfiks .char{animation:pullup 2.3s ease-in-out infinite}
  @keyframes pullup{0%,100%{transform:translateY(9px)}45%{transform:translateY(-15px)}}
  .m-barfiks .foreR{animation:flexR 2.3s ease-in-out infinite}
  .m-barfiks .foreL{animation:flexL 2.3s ease-in-out infinite}
  @keyframes flexR{0%,100%{transform:rotate(0)}45%{transform:rotate(42deg)}}
  @keyframes flexL{0%,100%{transform:rotate(0)}45%{transform:rotate(-42deg)}}
  .m-barfiks .legR{transform:rotate(11deg)}
  .m-barfiks .legL{transform:rotate(-11deg)}

  /* CLEAN PRESS: temizle-bas */
  .m-clean .kb{opacity:1}
  .m-clean .armR{transform:rotate(172deg)}
  .m-clean .armL{transform:rotate(-172deg)}
  .m-clean .char{animation:pdip 1.9s ease-in-out infinite}
  @keyframes pdip{0%,58%,100%{transform:translateY(5px)}30%{transform:translateY(-3px)}}
  .m-clean .foreR{animation:pressR 1.9s ease-in-out infinite}
  .m-clean .foreL{animation:pressL 1.9s ease-in-out infinite}
  @keyframes pressR{0%,100%{transform:rotate(126deg)}35%,52%{transform:rotate(2deg)}}
  @keyframes pressL{0%,100%{transform:rotate(-126deg)}35%,52%{transform:rotate(-2deg)}}

  .rep-badge{
    margin-top:10px;font-family:'Anton';font-size:34px;color:var(--snow);line-height:1;
  }
  .rep-badge small{font-family:'Archivo';font-weight:700;font-size:13px;color:var(--muted);letter-spacing:.14em;margin-left:4px}

  /* antrenman sırasında dağ gizli, sadece başlangıçta görünür */
  #app.workout .peak{display:none}

  /* ---------- VİDEO ALANI ---------- */
  .media{
    height:clamp(260px,46vh,520px); aspect-ratio:9/16; max-width:94%;
    border-radius:20px; overflow:hidden; position:relative; margin:4px 0;
    background:#0A0F1A; border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center;
  }
  .media video{width:100%;height:100%;object-fit:contain;display:block;background:#0A0F1A}
  .media .empty{display:flex;flex-direction:column;align-items:center;gap:12px;color:var(--muted);padding:22px;text-align:center}
  .media .empty .ic{font-size:30px;opacity:.8}
  .media .empty p{font-size:13px;line-height:1.4}
  .media .up{
    font-family:'Archivo';font-weight:700;font-size:14px;color:var(--valley);
    background:var(--gold);border:none;padding:12px 20px;border-radius:14px;cursor:pointer;
  }
  .media .change{
    position:absolute;bottom:10px;right:10px;
    background:rgba(11,18,32,.72);color:var(--ink);border:1px solid var(--line);
    font-size:12px;padding:6px 12px;border-radius:10px;backdrop-filter:blur(4px);cursor:pointer;
  }

  /* hafta toggle */
  .week-toggle{display:flex;gap:8px;margin-top:14px;width:100%;max-width:330px}
  .wtbtn{flex:1;font-family:'Archivo';font-weight:700;font-size:12px;letter-spacing:.06em;
    padding:10px 8px;border-radius:12px;border:1px solid var(--line);
    background:rgba(255,255,255,.04);color:var(--muted);cursor:pointer;transition:all .2s}
  .wtbtn.active{background:rgba(255,182,39,.12);border-color:rgba(255,182,39,.4);color:var(--gold)}
  .day-title{font-family:'Anton';font-size:44px;color:var(--snow);letter-spacing:.03em;margin:8px 0 2px}
  .day-pick{display:flex;flex-direction:column;gap:12px;width:100%;max-width:330px;margin-top:22px}
  .daybtn{display:flex;align-items:center;gap:15px;text-align:left;padding:16px 18px;border-radius:16px;
    border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--ink);cursor:pointer;transition:transform .08s}
  .daybtn b{font-family:'Anton';font-size:32px;color:var(--gold);width:36px;flex:none;text-align:center}
  .daybtn span{font-size:12px;color:var(--muted);line-height:1.35}
  .daybtn:active{transform:scale(.98)}
  /* süreli çalışma */
  .timed-row{display:flex;flex-direction:column;align-items:center;margin:12px 0 2px}
  .timed-row b{font-family:'Anton';font-size:56px;color:var(--cyan);line-height:1}
  .timed-row span{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-top:4px}
  /* hacim sayacı */
  .vol-btns{display:flex;gap:12px;margin-top:14px}
  .vol-btns button{font-family:'Archivo';font-weight:700;font-size:18px;color:var(--ink);
    background:rgba(255,255,255,.06);border:1px solid var(--line);width:74px;padding:13px 0;border-radius:14px;cursor:pointer}
  /* ---------- SABİT FOOTER ---------- */
  .footer{
    position:fixed; bottom:0; left:50%; transform:translateX(-50%);
    width:100%; max-width:520px; z-index:100;
    padding:10px 18px calc(14px + env(safe-area-inset-bottom));
    background:linear-gradient(to top, var(--valley) 60%, transparent);
    pointer-events:auto;
  }
  #app.workout .footer{
    background:linear-gradient(to top,#f7f9fb 65%,rgba(247,249,251,0));
  }
  .stageBox{ padding-bottom:110px; } /* footer yüksekliği kadar boşluk */

  
  /* ===== HOME SCREEN ===== */
  #app.home .peak{display:none}
  #app.home .footer{display:none}
  .home-screen.card{
    align-items:stretch;justify-content:flex-start;
    text-align:left;padding:0;
    overflow-y:auto;-webkit-overflow-scrolling:touch;
  }
  .hs-wrap{width:100%;padding:0 0 90px}
  .hs-header{
    display:flex;align-items:center;justify-content:space-between;
    padding:20px 20px 14px;
  }
  .hs-brand{display:flex;align-items:center;gap:10px}
  .hs-brand-icon{
    width:40px;height:40px;border-radius:12px;
    background:linear-gradient(135deg,var(--gold),var(--gold-2));
    display:flex;align-items:center;justify-content:center;font-size:20px;
    box-shadow:0 4px 14px rgba(255,138,61,.35);
  }
  .hs-brand-name{font-family:'Anton';font-size:16px;letter-spacing:.06em;color:var(--snow);line-height:1.1}
  .hs-brand-name small{display:block;font-family:'Archivo';font-size:9px;font-weight:600;letter-spacing:.22em;color:var(--muted)}
  .hs-avatar{
    width:40px;height:40px;border-radius:50%;
    background:linear-gradient(135deg,#243352,#324365);
    display:flex;align-items:center;justify-content:center;
    font-family:'Anton';font-size:13px;color:var(--gold);
    border:1.5px solid rgba(255,182,39,.3);
  }
  .hs-date-line{padding:0 20px 4px;font-size:11px;font-weight:700;letter-spacing:.18em;color:var(--muted)}
  .hs-greeting{padding:0 20px 20px;font-family:'Archivo';font-weight:800;font-size:26px;color:var(--snow);line-height:1.25}
  .hs-wk-row{padding:0 20px 20px;display:flex;gap:8px}
  .hs-wk-row .wtbtn{flex:1}
  /* day cards */
  .dc-row{padding:0 20px;display:flex;flex-direction:column;gap:12px;margin-bottom:28px}
  .day-card{
    position:relative;border-radius:22px;overflow:hidden;
    border:none;text-align:left;cursor:pointer;
    min-height:128px;padding:0;
    transition:transform .1s ease, box-shadow .1s ease;
    box-shadow:0 8px 24px rgba(0,0,0,.4);
  }
  .day-card:active{transform:scale(.98)}
  .dc-bg{position:absolute;inset:0}
  .dc-bg-A{background:linear-gradient(125deg,#7A2E10 0%,#C0521E 40%,#E8713D 100%)}
  .dc-bg-B{background:linear-gradient(125deg,#060E1F 0%,#0C1E3D 50%,#162E5A 100%)}
  .dc-deco{position:absolute;right:-10px;bottom:-14px;font-size:100px;line-height:1;
    opacity:.1;transform:rotate(-12deg);pointer-events:none;filter:grayscale(1)}
  .dc-content{position:relative;z-index:1;padding:18px 20px 16px}
  .dc-tag{font-family:'Archivo';font-weight:700;font-size:10px;letter-spacing:.22em;
    color:rgba(255,255,255,.65);margin-bottom:6px}
  .dc-title{font-family:'Anton';font-size:38px;color:#fff;letter-spacing:.04em;line-height:1;margin-bottom:6px}
  .dc-sub{font-size:12px;font-weight:600;color:rgba(255,255,255,.8);margin-bottom:3px}
  .dc-meta{font-size:11px;color:rgba(255,255,255,.45);font-weight:500}
  /* son antrenman */
  .last-section{padding:0 20px 20px}
  .last-title{font-family:'Archivo';font-weight:800;font-size:18px;color:var(--snow);margin-bottom:12px}
  .last-card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:16px}
  .last-top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .last-ico{width:42px;height:42px;border-radius:12px;
    background:rgba(255,182,39,.1);border:1px solid rgba(255,182,39,.2);
    display:flex;align-items:center;justify-content:center;font-size:18px;flex:none}
  .last-name{font-weight:700;font-size:15px;color:var(--snow)}
  .last-meta-txt{font-size:12px;color:var(--muted);margin-top:2px}
  .last-stats{display:flex;border-top:1px solid rgba(255,255,255,.08);padding-top:12px}
  .ls{flex:1;text-align:center}
  .ls:not(:last-child){border-right:1px solid rgba(255,255,255,.08)}
  .ls-label{font-size:10px;font-weight:700;letter-spacing:.14em;color:var(--muted);margin-bottom:4px}
  .ls-val{font-family:'Anton';font-size:22px;color:var(--snow);line-height:1}
  .ls-val small{font-family:'Archivo';font-size:11px;font-weight:600;color:var(--muted);margin-left:2px}
  /* bottom nav */
  .bottom-nav{
    position:fixed;bottom:0;left:50%;transform:translateX(-50%);
    width:100%;max-width:520px;
    display:flex;background:rgba(13,20,38,.96);border-top:1px solid rgba(255,255,255,.07);
    padding:10px 0 calc(10px + env(safe-area-inset-bottom));
    z-index:200;backdrop-filter:blur(12px);
  }
  .bn-btn{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
    background:none;border:none;color:var(--muted);font-family:'Archivo';
    font-size:11px;font-weight:600;cursor:pointer;padding:4px 0;
  }
  .bn-btn .bn-ic{font-size:20px;line-height:1}
  .bn-btn.active{color:var(--gold)}

  
  /* pause uyarısı */
  .pause-note{
    width:100%;text-align:center;
    font-family:'Anton';font-size:clamp(20px,6vw,28px);letter-spacing:.06em;
    color:var(--gold);line-height:1.2;
    padding:12px 16px;margin:6px 0 2px;
    background:rgba(255,182,39,.08);border:1px solid rgba(255,182,39,.28);
    border-radius:14px;
  }
  /* zil butonu */
  .bell-btn{
    display:flex;align-items:center;gap:6px;
    font-family:'Archivo';font-weight:700;font-size:11px;letter-spacing:.12em;
    color:var(--muted);background:rgba(255,255,255,.04);
    border:1px solid var(--line);border-radius:10px;padding:7px 13px;cursor:pointer;
  }
  .bell-btn.set{color:var(--go);border-color:rgba(52,211,153,.3);background:rgba(52,211,153,.06)}
  
  /* ===== WORKOUT KART TASARIMI ===== */
  .wk-card{
    background:linear-gradient(180deg,#131F38 0%,#0B1220 100%);
    justify-content:flex-start; padding:0; gap:0;
  }
  .wk-header{
    width:100%;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;
    padding:14px 20px 12px;
    background:rgba(255,255,255,.03);border-bottom:1px solid rgba(255,255,255,.06);
  }
  .wkh-left{display:flex;flex-direction:column;gap:2px}
  .wkh-day{font-family:'Anton';font-size:13px;letter-spacing:.12em;color:var(--gold)}
  .wkh-move{font-size:12px;font-weight:700;color:var(--snow);letter-spacing:.02em}
  .wkh-info{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.06em;
    background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);
    padding:4px 10px;border-radius:10px;white-space:nowrap}
  .wk-body{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:8px 20px 4px;width:100%;overflow:hidden;
  }
  /* rest kart */
